name: TurboWasm native SDK release

on:
  pull_request:
    paths:
      - ".github/workflows/native-sdk-release.yml"
      - "packaging/nuget/**"
      - "CMakeLists.txt"
      - "cmake/TurboWasmConfig.cmake.in"
      - "cmake/ci/restore-salts-sdk.ps1"
      - "include/turbowasm/**"
      - "src/**"
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      source_commit: ${{ steps.meta.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            case "$GITHUB_REF_NAME" in
              v[0-9]*.[0-9]*.[0-9]*) version="${GITHUB_REF_NAME#v}" ;;
              *) echo "release tags must be vX.Y.Z-compatible: $GITHUB_REF_NAME" >&2; exit 1 ;;
            esac
          else
            version="0.0.0-ci"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  unix:
    name: ${{ matrix.name }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 Runtime SDK
            runner: ubuntu-latest
            rid: linux-x64
          - name: macOS arm64 Runtime SDK
            runner: macos-15
            rid: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore latest Salts SDK
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./cmake/ci/restore-salts-sdk.ps1
      - name: Build and install Runtime-only SDK
        shell: bash
        run: |
          set -euxo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            test "$(uname -m)" = arm64
            command -v ninja >/dev/null 2>&1 || brew install ninja
          else
            command -v ninja >/dev/null 2>&1 || { sudo apt-get update; sudo apt-get install -y ninja-build; }
          fi
          prefix="$GITHUB_WORKSPACE/stage/sdk/${{ matrix.rid }}"
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DTURBOWASM_BUILD_TESTS=OFF \
            -DTURBOWASM_BUILD_TOOLS=OFF \
            -DTURBOWASM_BUILD_CONFORMANCE_RUNNER=OFF \
            -DTURBOWASM_ENABLE_MIR_JIT=OFF \
            -DTURBOWASM_ENABLE_COMPONENT=OFF \
            -DTURBOWASM_ENABLE_WASI02_ADAPTER=OFF \
            -DTURBOWASM_ENABLE_CFLOW_ADAPTER=OFF \
            -DTURBOWASM_ENABLE_NATIVE_IO_ADAPTER=OFF \
            -DTURBOWASM_ENABLE_WASI_ADAPTER=OFF \
            -DTURBOWASM_ENABLE_WASI_THREADS_ADAPTER=OFF \
            -DTURBOWASM_ENABLE_WASI_NATIVE_IO_ADAPTER=OFF \
            -DTURBOWASM_ENABLE_WASI_HOST_FS_ADAPTER=OFF \
            -DTURBOWASM_ENABLE_WASI_LITTLEFS_ADAPTER=OFF
          cmake --build build/release --parallel 2
          cmake --install build/release
          test -f "$prefix/lib/cmake/TurboWasm/TurboWasmConfig.cmake"
          test -f "$prefix/include/turbowasm/turbowasm.h"
          grep -F "TurboWasm::Runtime" "$prefix/lib/cmake/TurboWasm/TurboWasmTargets.cmake"
          ! grep -Eq "TurboWasm::(Component|CFlow|NativeIO|WASI)" "$prefix/lib/cmake/TurboWasm/TurboWasmTargets.cmake"
          cat > "$prefix/turbowasm-sdk-manifest.txt" <<EOF
          version=${{ needs.metadata.outputs.version }}
          commit=$GITHUB_SHA
          rid=${{ matrix.rid }}
          profile=runtime-only
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: turbowasm-sdk-${{ matrix.rid }}
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  windows:
    name: Windows x64 Runtime SDK
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore latest Salts SDK
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./cmake/ci/restore-salts-sdk.ps1
      - name: Build and install Runtime-only SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $prefix = Join-Path $env:GITHUB_WORKSPACE "stage\sdk\windows-x64"
          cmake -S . -B build/release-windows -G "Visual Studio 17 2022" -A x64 -DCMAKE_INSTALL_PREFIX="$prefix" -DTURBOWASM_BUILD_TESTS=OFF -DTURBOWASM_BUILD_TOOLS=OFF -DTURBOWASM_BUILD_CONFORMANCE_RUNNER=OFF -DTURBOWASM_ENABLE_MIR_JIT=OFF -DTURBOWASM_ENABLE_COMPONENT=OFF -DTURBOWASM_ENABLE_WASI02_ADAPTER=OFF -DTURBOWASM_ENABLE_CFLOW_ADAPTER=OFF -DTURBOWASM_ENABLE_NATIVE_IO_ADAPTER=OFF -DTURBOWASM_ENABLE_WASI_ADAPTER=OFF -DTURBOWASM_ENABLE_WASI_THREADS_ADAPTER=OFF -DTURBOWASM_ENABLE_WASI_NATIVE_IO_ADAPTER=OFF -DTURBOWASM_ENABLE_WASI_HOST_FS_ADAPTER=OFF -DTURBOWASM_ENABLE_WASI_LITTLEFS_ADAPTER=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/release-windows --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install build/release-windows --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $config = Join-Path $prefix "lib\cmake\TurboWasm\TurboWasmConfig.cmake"
          $header = Join-Path $prefix "include\turbowasm\turbowasm.h"
          $targets = Join-Path $prefix "lib\cmake\TurboWasm\TurboWasmTargets.cmake"
          if (-not (Test-Path $config)) { throw "missing $config" }
          if (-not (Test-Path $header)) { throw "missing $header" }
          if (-not ((Get-Content $targets -Raw) -match "TurboWasm::Runtime")) { throw "Runtime target missing" }
          @"
          version=${{ needs.metadata.outputs.version }}
          commit=$env:GITHUB_SHA
          rid=windows-x64
          profile=runtime-only
          "@ | Set-Content (Join-Path $prefix "turbowasm-sdk-manifest.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: turbowasm-sdk-windows-x64
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  android:
    name: Android arm64-v8a Runtime SDK
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore latest Android Salts SDK
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./cmake/ci/restore-salts-sdk.ps1 -SaltsRid android-arm64-v8a
      - name: Build and install Runtime-only Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          test -n "${ANDROID_NDK_HOME:-}"
          command -v ninja >/dev/null 2>&1 || { sudo apt-get update; sudo apt-get install -y ninja-build; }
          prefix="$GITHUB_WORKSPACE/stage/sdk/android-arm64-v8a"
          cmake -S . -B build/release-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DTURBOWASM_BUILD_TESTS=OFF \
            -DTURBOWASM_BUILD_TOOLS=OFF \
            -DTURBOWASM_BUILD_CONFORMANCE_RUNNER=OFF \
            -DTURBOWASM_ENABLE_MIR_JIT=OFF \
            -DTURBOWASM_ENABLE_COMPONENT=OFF \
            -DTURBOWASM_ENABLE_WASI02_ADAPTER=OFF \
            -DTURBOWASM_ENABLE_CFLOW_ADAPTER=OFF \
            -DTURBOWASM_ENABLE_NATIVE_IO_ADAPTER=OFF \
            -DTURBOWASM_ENABLE_WASI_ADAPTER=OFF \
            -DTURBOWASM_ENABLE_WASI_THREADS_ADAPTER=OFF \
            -DTURBOWASM_ENABLE_WASI_NATIVE_IO_ADAPTER=OFF \
            -DTURBOWASM_ENABLE_WASI_HOST_FS_ADAPTER=OFF \
            -DTURBOWASM_ENABLE_WASI_LITTLEFS_ADAPTER=OFF
          cmake --build build/release-android --parallel 2
          cmake --install build/release-android
          test -f "$prefix/lib/cmake/TurboWasm/TurboWasmConfig.cmake"
          test -f "$prefix/include/turbowasm/turbowasm.h"
          grep -F "TurboWasm::Runtime" "$prefix/lib/cmake/TurboWasm/TurboWasmTargets.cmake"
          cat > "$prefix/turbowasm-sdk-manifest.txt" <<EOF
          version=${{ needs.metadata.outputs.version }}
          commit=$GITHUB_SHA
          rid=android-arm64-v8a
          profile=runtime-only
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: turbowasm-sdk-android-arm64-v8a
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  pack:
    name: Pack TurboWasm.Native
    needs: [metadata, unix, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: turbowasm-sdk-*
          path: package/sdk
          merge-multiple: true
      - name: Verify package payload
        shell: bash
        run: |
          set -euxo pipefail
          for rid in linux-x64 windows-x64 macos-arm64 android-arm64-v8a; do
            test -f "package/sdk/$rid/lib/cmake/TurboWasm/TurboWasmConfig.cmake"
            test -f "package/sdk/$rid/include/turbowasm/turbowasm.h"
            grep -F "TurboWasm::Runtime" "package/sdk/$rid/lib/cmake/TurboWasm/TurboWasmTargets.cmake"
            test -f "package/sdk/$rid/turbowasm-sdk-manifest.txt"
          done
          test "$(find package/sdk -maxdepth 2 -name turbowasm-sdk-manifest.txt | wc -l)" -eq 4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Pack Runtime SDK
        shell: bash
        run: |
          set -euxo pipefail
          dotnet pack packaging/nuget/TurboWasm.Native.csproj --configuration Release --output dist -p:PackageVersion=${{ needs.metadata.outputs.version }} -p:PackageRoot="$GITHUB_WORKSPACE/package"
          nupkg="dist/TurboWasm.Native.${{ needs.metadata.outputs.version }}.nupkg"
          test -f "$nupkg"
          unzip -p "$nupkg" '*.nuspec' > "$RUNNER_TEMP/turbowasm.nuspec"
          if grep -q "<dependencies" "$RUNNER_TEMP/turbowasm.nuspec"; then
            echo "TurboWasm.Native must not publish dependency metadata" >&2
            cat "$RUNNER_TEMP/turbowasm.nuspec" >&2
            exit 1
          fi
          unzip -Z1 "$nupkg" | sort | tee "$RUNNER_TEMP/turbowasm-nupkg.txt"
          grep -Fx "sdk/linux-x64/include/turbowasm/turbowasm.h" "$RUNNER_TEMP/turbowasm-nupkg.txt"
          grep -Fx "sdk/windows-x64/include/turbowasm/turbowasm.h" "$RUNNER_TEMP/turbowasm-nupkg.txt"
          grep -Fx "sdk/macos-arm64/include/turbowasm/turbowasm.h" "$RUNNER_TEMP/turbowasm-nupkg.txt"
          grep -Fx "sdk/android-arm64-v8a/include/turbowasm/turbowasm.h" "$RUNNER_TEMP/turbowasm-nupkg.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: turbowasm-native-nuget
          path: dist/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish package and GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [metadata, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: turbowasm-native-nuget
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          dotnet nuget add source --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text --name github https://nuget.pkg.github.com/qigao/index.json
          dotnet nuget push "dist/TurboWasm.Native.${{ needs.metadata.outputs.version }}.nupkg" --api-key "$GITHUB_TOKEN" --source github --skip-duplicate
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          gh release create "$GITHUB_REF_NAME" dist/*.nupkg --repo "$GITHUB_REPOSITORY" --verify-tag --title "TurboWasm ${{ needs.metadata.outputs.version }}" --generate-notes
