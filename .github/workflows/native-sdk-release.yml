name: TurboWasm native SDK release

on:
  pull_request:
    paths:
      - ".github/workflows/native-sdk-release.yml"
      - "packaging/nuget/**"
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "CMake*Presets.json"
      - "presets/**"
      - "vcpkg.json"
      - "cmake/vcpkg-cache.nuget.config"
      - ".github/workflows/native-build.yml"
      - "cmake/TurboWasmConfig.cmake.in"
      - "cmake/ci/restore-salts-sdk.ps1"
      - "include/turbowasm/**"
      - "src/**"
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      source_commit: ${{ steps.meta.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            case "$GITHUB_REF_NAME" in
              v[0-9]*.[0-9]*.[0-9]*) version="${GITHUB_REF_NAME#v}" ;;
              *) echo "release tags must be vX.Y.Z-compatible: $GITHUB_REF_NAME" >&2; exit 1 ;;
            esac
          else
            version="0.0.0-ci"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  native:
    needs: metadata
    uses: ./.github/workflows/native-build.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
      builds: >-
        {"include":[
          {"runner":"ubuntu-latest","rid":"linux-x64","triplet":"x64-linux","host_triplet":"x64-linux","preset":"ci-sdk-user","package":true},
          {"runner":"macos-15","rid":"macos-arm64","triplet":"arm64-osx","host_triplet":"arm64-osx","preset":"ci-sdk-user","package":true},
          {"runner":"windows-2025","rid":"windows-x64","triplet":"x64-windows","host_triplet":"x64-windows","preset":"ci-win-sdk-user","package":true},
          {"runner":"ubuntu-latest","rid":"android-arm64-v8a","triplet":"arm64-android","host_triplet":"x64-linux","preset":"ci-android-sdk-user","package":true}
        ]}

  pack:
    name: Pack TurboWasm.Native
    needs: [metadata, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: turbowasm-sdk-*
          path: package/sdk
          merge-multiple: true
      - name: Verify package payload
        shell: bash
        run: |
          set -euxo pipefail
          for rid in linux-x64 windows-x64 macos-arm64 android-arm64-v8a; do
            test -f "package/sdk/$rid/lib/cmake/TurboWasm/TurboWasmConfig.cmake"
            test -f "package/sdk/$rid/include/turbowasm/turbowasm.h"
            test -f "package/sdk/$rid/include/turbowasm/component.h"
            grep -F "TurboWasm::Runtime" "package/sdk/$rid/lib/cmake/TurboWasm/TurboWasmTargets.cmake"
            grep -F "TurboWasm::Component" "package/sdk/$rid/lib/cmake/TurboWasm/TurboWasmTargets.cmake"
            ! grep -Eq "TurboWasm::(CFlow|NativeIO|WASI|WASI02)" "package/sdk/$rid/lib/cmake/TurboWasm/TurboWasmTargets.cmake"
            test -f "package/sdk/$rid/turbowasm-sdk-manifest.txt"
          done
          test "$(find package/sdk -maxdepth 2 -name turbowasm-sdk-manifest.txt | wc -l)" -eq 4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Pack Runtime SDK
        shell: bash
        run: |
          set -euxo pipefail
          dotnet pack packaging/nuget/TurboWasm.Native.csproj --configuration Release --output dist -p:PackageVersion=${{ needs.metadata.outputs.version }} -p:PackageRoot="$GITHUB_WORKSPACE/package"
          nupkg="dist/TurboWasm.Native.${{ needs.metadata.outputs.version }}.nupkg"
          test -f "$nupkg"
          unzip -p "$nupkg" '*.nuspec' > "$RUNNER_TEMP/turbowasm.nuspec"
          if grep -q "<dependencies" "$RUNNER_TEMP/turbowasm.nuspec"; then
            echo "TurboWasm.Native must not publish dependency metadata" >&2
            cat "$RUNNER_TEMP/turbowasm.nuspec" >&2
            exit 1
          fi
          unzip -Z1 "$nupkg" | sort | tee "$RUNNER_TEMP/turbowasm-nupkg.txt"
          grep -Fx "sdk/linux-x64/include/turbowasm/turbowasm.h" "$RUNNER_TEMP/turbowasm-nupkg.txt"
          grep -Fx "sdk/linux-x64/include/turbowasm/component.h" "$RUNNER_TEMP/turbowasm-nupkg.txt"
          grep -Fx "sdk/windows-x64/include/turbowasm/turbowasm.h" "$RUNNER_TEMP/turbowasm-nupkg.txt"
          grep -Fx "sdk/windows-x64/include/turbowasm/component.h" "$RUNNER_TEMP/turbowasm-nupkg.txt"
          grep -Fx "sdk/macos-arm64/include/turbowasm/turbowasm.h" "$RUNNER_TEMP/turbowasm-nupkg.txt"
          grep -Fx "sdk/macos-arm64/include/turbowasm/component.h" "$RUNNER_TEMP/turbowasm-nupkg.txt"
          grep -Fx "sdk/android-arm64-v8a/include/turbowasm/turbowasm.h" "$RUNNER_TEMP/turbowasm-nupkg.txt"
          grep -Fx "sdk/android-arm64-v8a/include/turbowasm/component.h" "$RUNNER_TEMP/turbowasm-nupkg.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: turbowasm-native-nuget
          path: dist/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish package and GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [metadata, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: turbowasm-native-nuget
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          dotnet nuget add source --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text --name github https://nuget.pkg.github.com/qigao/index.json
          dotnet nuget push "dist/TurboWasm.Native.${{ needs.metadata.outputs.version }}.nupkg" --api-key "$GITHUB_TOKEN" --source github --skip-duplicate
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          gh release create "$GITHUB_REF_NAME" dist/*.nupkg --repo "$GITHUB_REPOSITORY" --verify-tag --title "TurboWasm ${{ needs.metadata.outputs.version }}" --generate-notes
