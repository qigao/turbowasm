name: TurboWasm CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      salts_ci_run:
        description: Optional Salts SDK CI run for native socket qualification
        type: string
        default: ''
      skip_windows:
        description: Qualify non-Windows platforms only
        type: boolean
        default: false
      metallic_guests:
        description: Qualify the local Metallic guest SDK on Linux (requires the filesystem prerequisite SDK)
        type: boolean
        default: false

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: turbowasm-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select affected checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      builds: ${{ steps.select.outputs.builds }}
      has_builds: ${{ steps.select.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select native profiles
        id: select
        shell: pwsh
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_SKIP_WINDOWS: ${{ inputs.skip_windows || false }}
          CI_METALLIC_GUESTS: ${{ inputs.metallic_guests || false }}
        run: ./cmake/ci/select-ci-scope.ps1 -EventName $env:CI_EVENT -BaseRef $env:CI_BASE -HeadRef $env:CI_HEAD -SkipWindows ($env:CI_SKIP_WINDOWS -eq 'true')
  native:
    needs: scope
    if: needs.scope.outputs.has_builds == 'true'
    uses: ./.github/workflows/native-build.yml
    with:
      builds: ${{ needs.scope.outputs.builds }}
      salts_ci_run: ${{ inputs.salts_ci_run || '' }}
      skip_windows: ${{ inputs.skip_windows || false }}
  result:
    name: CI result
    needs: [scope, native]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful selected checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          HAS_BUILDS: ${{ needs.scope.outputs.has_builds }}
          BUILD_RESULT: ${{ needs.native.result }}
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = success
          if [ "$HAS_BUILDS" = true ]; then test "$BUILD_RESULT" = success; fi
