name: TurboWasm CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TurboWasm
        uses: actions/checkout@v4

      - name: Checkout Salts master
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: master
          path: deps/salts
          persist-credentials: false

      - name: Resolve Salts cache identity
        id: salts-cache-meta
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C deps/salts rev-parse HEAD)"
          test -n "$sha"
          image_family="${ImageOS:-ubuntu-latest}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image-family=$image_family" >> "$GITHUB_OUTPUT"

      - name: Restore exact-master Salts SDK
        id: salts-sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/salts-sdk-linux
          key: turbowasm-salts-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.salts-cache-meta.outputs.image-family }}-${{ steps.salts-cache-meta.outputs.sha }}

      - name: Validate restored Salts SDK
        id: salts-sdk-restore
        shell: bash
        run: |
          set -euo pipefail
          salts_root="$RUNNER_TEMP/salts-sdk-linux"
          valid=false
          if test -f "$salts_root/lib/cmake/Salts/SaltsConfig.cmake" &&
             test -f "$salts_root/lib/cmake/Salts/SaltsTargets.cmake"; then
            valid=true
          fi
          echo "valid=$valid" >> "$GITHUB_OUTPUT"
          echo "Restored Salts SDK valid: $valid"

      - name: Ensure Ninja
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Restore Salts build dependencies
        if: steps.salts-sdk-restore.outputs.valid != 'true'
        uses: ./deps/salts/.github/actions/setup-re2c-tools

      - name: Build and install Salts master
        if: steps.salts-sdk-restore.outputs.valid != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          salts_root="$RUNNER_TEMP/salts-sdk-linux"
          vcpkg_installed="$GITHUB_WORKSPACE/build/salts-vcpkg"
          cmake -S deps/salts -B build/salts -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$vcpkg_installed" \
            -DVCPKG_OVERLAY_PORTS="$VCPKG_OVERLAY_PORTS" \
            -DCMAKE_INSTALL_PREFIX="$salts_root" \
            -DENABLE_TESTS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_BENCHMARKS=OFF
          cmake --build build/salts -j2
          cmake --install build/salts

      - name: Record Salts master provenance
        shell: bash
        run: |
          set -euxo pipefail
          salts_root="$RUNNER_TEMP/salts-sdk-linux"
          head="$(git -C deps/salts rev-parse HEAD)"
          test "$(git -C deps/salts branch --show-current)" = "master"
          test "$head" = "${{ steps.salts-cache-meta.outputs.sha }}"
          test -f "$salts_root/lib/cmake/Salts/SaltsConfig.cmake"
          grep -q "Salts::SIMD" "$salts_root/lib/cmake/Salts/SaltsTargets.cmake"
          echo "Salts SDK exact-key hit: ${{ steps.salts-sdk-cache.outputs.cache-hit }}"
          echo "Salts SDK restored valid: ${{ steps.salts-sdk-restore.outputs.valid }}"
          echo "Salts master: $head"
          echo "SALTS_ROOT=$salts_root" >> "$GITHUB_ENV"

      - name: Configure TurboWasm
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/turbowasm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/turbowasm-sdk" \
            -DTURBOWASM_BUILD_TESTS=ON \
            -DTURBOWASM_BUILD_TOOLS=ON

      - name: Build and test TurboWasm
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/turbowasm -j2
          ctest --test-dir build/turbowasm --no-tests=error --output-on-failure

      - name: Install TurboWasm
        shell: bash
        run: |
          set -euxo pipefail
          cmake --install build/turbowasm
          test -f "$RUNNER_TEMP/turbowasm-sdk/lib/cmake/TurboWasm/TurboWasmConfig.cmake"

      - name: Qualify installed package consumer
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S tests/installed_consumer -B build/installed-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/turbowasm-sdk;$SALTS_ROOT"
          cmake --build build/installed-consumer -j2
          ctest --test-dir build/installed-consumer \
            --no-tests=error --output-on-failure

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout TurboWasm
        uses: actions/checkout@v4

      - name: Checkout Salts master
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: master
          path: deps/salts
          persist-credentials: false

      - name: Resolve Salts cache identity
        id: salts-cache-meta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sha = (git -C deps/salts rev-parse HEAD).Trim()
          if ([string]::IsNullOrWhiteSpace($sha)) { throw "unable to resolve Salts master SHA" }
          $imageFamily = $env:ImageOS
          if ([string]::IsNullOrWhiteSpace($imageFamily)) {
            $imageFamily = "windows-2022"
          }
          $legacyImage = "$imageFamily-$env:ImageVersion"
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "image-family=$imageFamily" >> $env:GITHUB_OUTPUT
          "legacy-image=$legacyImage" >> $env:GITHUB_OUTPUT

      - name: Restore exact-master Salts SDK
        id: salts-sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/salts-sdk-windows
          key: turbowasm-salts-sdk-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.salts-cache-meta.outputs.image-family }}-${{ steps.salts-cache-meta.outputs.sha }}
          restore-keys: |
            turbowasm-salts-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.salts-cache-meta.outputs.legacy-image }}-${{ steps.salts-cache-meta.outputs.sha }}

      - name: Validate restored Salts SDK
        id: salts-sdk-restore
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $saltsRoot = Join-Path $env:RUNNER_TEMP "salts-sdk-windows"
          $config = Join-Path $saltsRoot "lib\cmake\Salts\SaltsConfig.cmake"
          $targets = Join-Path $saltsRoot "lib\cmake\Salts\SaltsTargets.cmake"
          $valid = (Test-Path -LiteralPath $config -PathType Leaf) -and
                   (Test-Path -LiteralPath $targets -PathType Leaf)
          "valid=$($valid.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Restored Salts SDK valid: $valid"

      - name: Ensure Ninja
        if: steps.salts-sdk-restore.outputs.valid == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($null -eq (Get-Command ninja.exe -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }

      - name: Restore Salts build dependencies
        if: steps.salts-sdk-restore.outputs.valid != 'true'
        uses: ./deps/salts/.github/actions/setup-re2c-tools

      - name: Resolve MSVC environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw "Visual Studio x64 C++ toolchain was not found"
          }
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV

      - name: Build and install Salts master
        if: steps.salts-sdk-restore.outputs.valid != 'true'
        shell: cmd
        working-directory: deps/salts
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          cmake --preset win-release-user -DENABLE_TESTS=OFF -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF
          if errorlevel 1 exit /b 1
          cmake --build --preset win-release-user --parallel 2
          if errorlevel 1 exit /b 1
          cmake --install build\Msvc-Release --prefix "%RUNNER_TEMP%\salts-sdk-windows" --config Release
          if errorlevel 1 exit /b 1

      - name: Record Salts master provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $saltsRoot = Join-Path $env:RUNNER_TEMP "salts-sdk-windows"
          if (-not (Test-Path -LiteralPath (Join-Path $saltsRoot "lib\cmake\Salts\SaltsConfig.cmake") -PathType Leaf)) {
            throw "installed SaltsConfig.cmake is missing"
          }
          $targets = Join-Path $saltsRoot "lib\cmake\Salts\SaltsTargets.cmake"
          if (-not (Select-String -LiteralPath $targets -SimpleMatch "Salts::SIMD" -Quiet)) {
            throw "installed Salts SDK does not export Salts::SIMD"
          }
          $head = (git -C deps/salts rev-parse HEAD).Trim()
          $branch = (git -C deps/salts branch --show-current).Trim()
          if ($branch -ne "master") { throw "expected Salts master, got $branch at $head" }
          if ($head -ne "${{ steps.salts-cache-meta.outputs.sha }}") {
            throw "Salts checkout moved after cache identity resolution"
          }
          Write-Host "Salts SDK exact-key hit: ${{ steps.salts-sdk-cache.outputs.cache-hit }}"
          Write-Host "Salts SDK restored valid: ${{ steps.salts-sdk-restore.outputs.valid }}"
          Write-Host "Salts master: $head"
          "SALTS_ROOT=$saltsRoot" >> $env:GITHUB_ENV

      - name: Configure, build and test TurboWasm
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "PATH=%SALTS_ROOT%\bin;%PATH%"
          cmake -S . -B build\turbowasm-windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="%RUNNER_TEMP%\turbowasm-sdk-windows" -DTURBOWASM_BUILD_TESTS=ON -DTURBOWASM_BUILD_TOOLS=ON -DTURBOWASM_ENABLE_MIR_JIT=OFF
          if errorlevel 1 exit /b 1
          cmake --build build\turbowasm-windows --parallel 2
          if errorlevel 1 exit /b 1
          ctest --test-dir build\turbowasm-windows --no-tests=error --output-on-failure
          if errorlevel 1 exit /b 1
          cmake --install build\turbowasm-windows
          if errorlevel 1 exit /b 1

      - name: Qualify installed package consumer
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "PATH=%SALTS_ROOT%\bin;%RUNNER_TEMP%\turbowasm-sdk-windows\bin;%PATH%"
          cmake -S tests\installed_consumer -B build\installed-consumer-windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%RUNNER_TEMP%\turbowasm-sdk-windows;%SALTS_ROOT%"
          if errorlevel 1 exit /b 1
          cmake --build build\installed-consumer-windows --parallel 2
          if errorlevel 1 exit /b 1
          ctest --test-dir build\installed-consumer-windows --no-tests=error --output-on-failure
          if errorlevel 1 exit /b 1

      - name: Verify Runtime export is MIR-free
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $targets = Join-Path $env:RUNNER_TEMP "turbowasm-sdk-windows\lib\cmake\TurboWasm\TurboWasmTargets.cmake"
          if (-not (Test-Path -LiteralPath $targets -PathType Leaf)) { throw "missing $targets" }
          $text = Get-Content -LiteralPath $targets -Raw
          if ($text -match "MIR::MIR|mir-jit") { throw "MIR leaked into Windows Runtime export" }


  linux-mir:
    name: Linux x64 + MIR JIT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TurboWasm
        uses: actions/checkout@v4

      - name: Checkout Salts master
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: master
          path: deps/salts
          persist-credentials: false

      - name: Resolve Salts cache identity
        id: salts-cache-meta
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C deps/salts rev-parse HEAD)"
          test -n "$sha"
          image_family="${ImageOS:-ubuntu-latest}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image-family=$image_family" >> "$GITHUB_OUTPUT"

      - name: Restore exact-master Salts SDK
        id: salts-sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/salts-sdk-linux
          key: turbowasm-salts-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.salts-cache-meta.outputs.image-family }}-${{ steps.salts-cache-meta.outputs.sha }}

      - name: Validate restored Salts SDK
        id: salts-sdk-restore
        shell: bash
        run: |
          set -euo pipefail
          salts_root="$RUNNER_TEMP/salts-sdk-linux"
          valid=false
          if test -f "$salts_root/lib/cmake/Salts/SaltsConfig.cmake" &&
             test -f "$salts_root/lib/cmake/Salts/SaltsTargets.cmake"; then
            valid=true
          fi
          echo "valid=$valid" >> "$GITHUB_OUTPUT"
          echo "Restored Salts SDK valid: $valid"

      - name: Ensure Ninja
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Restore Salts build dependencies
        if: steps.salts-sdk-restore.outputs.valid != 'true'
        uses: ./deps/salts/.github/actions/setup-re2c-tools

      - name: Configure shared vcpkg cache for MIR
        if: steps.salts-sdk-restore.outputs.valid == 'true'
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Build and install Salts master
        if: steps.salts-sdk-restore.outputs.valid != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          salts_root="$RUNNER_TEMP/salts-sdk-linux"
          vcpkg_installed="$GITHUB_WORKSPACE/build/salts-vcpkg-mir"
          cmake -S deps/salts -B build/salts-mir -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$vcpkg_installed" \
            -DVCPKG_OVERLAY_PORTS="$VCPKG_OVERLAY_PORTS" \
            -DCMAKE_INSTALL_PREFIX="$salts_root" \
            -DENABLE_TESTS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_BENCHMARKS=OFF
          cmake --build build/salts-mir -j2
          cmake --install build/salts-mir

      - name: Record Salts master provenance
        shell: bash
        run: |
          set -euxo pipefail
          salts_root="$RUNNER_TEMP/salts-sdk-linux"
          head="$(git -C deps/salts rev-parse HEAD)"
          test "$(git -C deps/salts branch --show-current)" = "master"
          test "$head" = "${{ steps.salts-cache-meta.outputs.sha }}"
          test -f "$salts_root/lib/cmake/Salts/SaltsConfig.cmake"
          grep -q "Salts::SIMD" "$salts_root/lib/cmake/Salts/SaltsTargets.cmake"
          echo "Salts SDK exact-key hit: ${{ steps.salts-sdk-cache.outputs.cache-hit }}"
          echo "Salts SDK restored valid: ${{ steps.salts-sdk-restore.outputs.valid }}"
          echo "Salts master: $head"
          echo "SALTS_ROOT=$salts_root" >> "$GITHUB_ENV"

      - name: Restore MIR from shared cache only
        shell: bash
        run: |
          set -euxo pipefail
          test -n "$VCPKG_CACHE_REPOSITORY_ROOT"
          log="$RUNNER_TEMP/turbowasm-mir-cache.log"
          mir_root="$GITHUB_WORKSPACE/build/mir-vcpkg"
          rm -rf "$mir_root"
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$VCPKG_CACHE_REPOSITORY_ROOT/manifests/turbowasm-mir" \
            --x-install-root="$mir_root" \
            --triplet x64-linux \
            --only-binarycaching 2>&1 | tee "$log"
          ! grep -Eq '^Building mir-jit:x64-linux' "$log"
          grep -Eq 'Restored [1-9][0-9]* package\(s\) from NuGet' "$log"
          test -f "$mir_root/x64-linux/share/MIR/MIRConfig.cmake"
          echo "MIR_PREFIX=$mir_root/x64-linux" >> "$GITHUB_ENV"

      - name: Configure TurboWasm with MIR JIT
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/turbowasm-mir -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$MIR_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/turbowasm-sdk-mir" \
            -DTURBOWASM_BUILD_TESTS=ON \
            -DTURBOWASM_BUILD_TOOLS=ON \
            -DTURBOWASM_ENABLE_MIR_JIT=ON

      - name: Build and test MIR JIT backend
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/turbowasm-mir -j2
          ctest --test-dir build/turbowasm-mir \
            --no-tests=error --output-on-failure
          ctest --test-dir build/turbowasm-mir \
            -R turbowasm_mir_backend_test \
            --output-on-failure

      - name: Install and verify Runtime export stays MIR-free
        shell: bash
        run: |
          set -euxo pipefail
          cmake --install build/turbowasm-mir
          targets="$RUNNER_TEMP/turbowasm-sdk-mir/lib/cmake/TurboWasm/TurboWasmTargets.cmake"
          test -f "$targets"
          ! grep -q 'MIR::MIR' "$targets"
          ! grep -q 'mir-jit' "$targets"

  macos-mir:
    name: macOS + MIR JIT
    runs-on: macos-15
    steps:
      - name: Checkout TurboWasm
        uses: actions/checkout@v4

      - name: Checkout Salts master
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: master
          path: deps/salts
          persist-credentials: false

      - name: Resolve Salts cache identity
        id: salts-cache-meta
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C deps/salts rev-parse HEAD)"
          test -n "$sha"
          image_family="${ImageOS:-macos-15}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image-family=$image_family" >> "$GITHUB_OUTPUT"

      - name: Restore exact-master Salts SDK
        id: salts-sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/salts-sdk-macos
          key: turbowasm-salts-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.salts-cache-meta.outputs.image-family }}-${{ steps.salts-cache-meta.outputs.sha }}

      - name: Validate restored Salts SDK
        id: salts-sdk-restore
        shell: bash
        run: |
          set -euo pipefail
          salts_root="$RUNNER_TEMP/salts-sdk-macos"
          valid=false
          if test -f "$salts_root/lib/cmake/Salts/SaltsConfig.cmake" &&
             test -f "$salts_root/lib/cmake/Salts/SaltsTargets.cmake"; then
            valid=true
          fi
          echo "valid=$valid" >> "$GITHUB_OUTPUT"
          echo "Restored Salts SDK valid: $valid"

      - name: Prepare host build tools
        shell: bash
        run: |
          set -euxo pipefail
          command -v ninja >/dev/null 2>&1 || brew install ninja
          case "$RUNNER_ARCH" in
            X64) echo "TURBOWASM_MIR_TRIPLET=x64-osx" >> "$GITHUB_ENV" ;;
            ARM64) echo "TURBOWASM_MIR_TRIPLET=arm64-osx" >> "$GITHUB_ENV" ;;
            *) echo "unsupported macOS arch: $RUNNER_ARCH" >&2; exit 1 ;;
          esac

      - name: Restore Salts build dependencies
        if: steps.salts-sdk-restore.outputs.valid != 'true'
        uses: ./deps/salts/.github/actions/setup-re2c-tools

      - name: Configure shared vcpkg cache for MIR
        if: steps.salts-sdk-restore.outputs.valid == 'true'
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Build and install Salts master
        if: steps.salts-sdk-restore.outputs.valid != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          salts_root="$RUNNER_TEMP/salts-sdk-macos"
          vcpkg_installed="$GITHUB_WORKSPACE/build/salts-vcpkg-mir"
          cmake -S deps/salts -B build/salts-mir -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$TURBOWASM_MIR_TRIPLET" \
            -DVCPKG_INSTALLED_DIR="$vcpkg_installed" \
            -DVCPKG_OVERLAY_PORTS="$VCPKG_OVERLAY_PORTS" \
            -DCMAKE_INSTALL_PREFIX="$salts_root" \
            -DENABLE_TESTS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_BENCHMARKS=OFF
          cmake --build build/salts-mir -j2
          cmake --install build/salts-mir

      - name: Record Salts master provenance
        shell: bash
        run: |
          set -euxo pipefail
          salts_root="$RUNNER_TEMP/salts-sdk-macos"
          head="$(git -C deps/salts rev-parse HEAD)"
          test "$(git -C deps/salts branch --show-current)" = "master"
          test "$head" = "${{ steps.salts-cache-meta.outputs.sha }}"
          test -f "$salts_root/lib/cmake/Salts/SaltsConfig.cmake"
          grep -q "Salts::SIMD" "$salts_root/lib/cmake/Salts/SaltsTargets.cmake"
          echo "Salts SDK exact-key hit: ${{ steps.salts-sdk-cache.outputs.cache-hit }}"
          echo "Salts SDK restored valid: ${{ steps.salts-sdk-restore.outputs.valid }}"
          echo "Salts master: $head"
          echo "SALTS_ROOT=$salts_root" >> "$GITHUB_ENV"

      - name: Restore MIR from shared cache only
        shell: bash
        run: |
          set -euxo pipefail
          test -n "$VCPKG_CACHE_REPOSITORY_ROOT"
          log="$RUNNER_TEMP/turbowasm-mir-cache.log"
          mir_root="$GITHUB_WORKSPACE/build/mir-vcpkg"
          rm -rf "$mir_root"
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$VCPKG_CACHE_REPOSITORY_ROOT/manifests/turbowasm-mir" \
            --x-install-root="$mir_root" \
            --triplet "$TURBOWASM_MIR_TRIPLET" \
            --only-binarycaching 2>&1 | tee "$log"
          ! grep -Eq "^Building mir-jit:$TURBOWASM_MIR_TRIPLET" "$log"
          grep -Eq 'Restored [1-9][0-9]* package\(s\) from NuGet' "$log"
          test -f "$mir_root/$TURBOWASM_MIR_TRIPLET/share/MIR/MIRConfig.cmake"
          echo "MIR_PREFIX=$mir_root/$TURBOWASM_MIR_TRIPLET" >> "$GITHUB_ENV"

      - name: Configure TurboWasm with MIR JIT
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/turbowasm-mir -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$MIR_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/turbowasm-sdk-mir" \
            -DTURBOWASM_BUILD_TESTS=ON \
            -DTURBOWASM_BUILD_TOOLS=ON \
            -DTURBOWASM_ENABLE_MIR_JIT=ON

      - name: Build and test MIR JIT backend
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/turbowasm-mir -j2
          ctest --test-dir build/turbowasm-mir \
            --no-tests=error --output-on-failure
          ctest --test-dir build/turbowasm-mir \
            -R turbowasm_mir_backend_test \
            --output-on-failure

      - name: Install and verify Runtime export stays MIR-free
        shell: bash
        run: |
          set -euxo pipefail
          cmake --install build/turbowasm-mir
          targets="$RUNNER_TEMP/turbowasm-sdk-mir/lib/cmake/TurboWasm/TurboWasmTargets.cmake"
          test -f "$targets"
          ! grep -q 'MIR::MIR' "$targets"
          ! grep -q 'mir-jit' "$targets"
