name: TurboWasm CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turbowasm-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.sdk }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: linux-clang-x64
            runner: ubuntu-24.04
            triplet: x64-linux
            preset: llvm-native-release-user
            test: true
            mir: true
            littlefs: true
          - sdk: linux-clang-arm64
            runner: ubuntu-24.04-arm
            triplet: arm64-linux
            preset: llvm-native-release-user
            test: true
            mir: true
            littlefs: true
          - sdk: macos-clang-arm64
            runner: macos-15
            triplet: arm64-osx
            preset: llvm-native-release-user
            test: true
            mir: true
            littlefs: false
          - sdk: windows-llvm-mingw-x64
            runner: windows-2025
            triplet: qigao-x64-windows-llvm-mingw
            preset: llvm-mingw-x64-release-user
            test: true
            mir: true
            littlefs: false
          - sdk: windows-llvm-mingw-arm64
            runner: windows-11-arm
            triplet: qigao-arm64-windows-llvm-mingw
            preset: llvm-mingw-arm64-release-user
            test: true
            mir: false
            littlefs: false
          - sdk: android-x64
            runner: ubuntu-24.04
            triplet: x64-android
            preset: android-x64-release-user
            test: false
            mir: false
            littlefs: false
          - sdk: android-arm64
            runner: ubuntu-24.04
            triplet: arm64-android
            preset: android-arm64-release-user
            test: false
            mir: false
            littlefs: false
    uses: ./.github/workflows/native-build.yml
    with:
      profile: ${{ matrix.sdk }}
      runner: ${{ matrix.runner }}
      triplet: ${{ matrix.triplet }}
      preset: ${{ matrix.preset }}
      tests: ${{ matrix.test }}
      mir: ${{ matrix.mir }}
      littlefs: ${{ matrix.littlefs }}
  result:
    name: CI result
    needs: native
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.native.result }}
        run: test "$RESULT" = success
