          ! grep -Eq '^Building [^:]+:x64-linux' "$log"
          grep -Eq 'Restored [1-9][0-9]* package\(s\) from NuGet' "$log"
          tool="$install_root/x64-linux/tools/wabt/wast2json"
          test -x "$tool"
          "$tool" --version
          echo "WAST2JSON=$tool" >> "$GITHUB_ENV"

      - name: Run qualified threads proposal suite
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/turbowasm-proposal-threads.log"
          python3 tests/conformance/run_proposal.py \
            --selector threads \
            --wast2json "$WAST2JSON" \
            --runner "$PWD/build/conformance-threads/tests/conformance/turbowasm_spec_runner" \
            --work-dir "$RUNNER_TEMP/turbowasm-proposal-threads" \
            2>&1 | tee "$log"

          grep -Fq 'PROPOSAL_SELECTOR name=threads commit=cc535ada1aa21cfaa3cabf3ac73b89acef78a0a0 files=13' "$log"
          grep -Eq 'CORE_CONFORMANCE pass=[1-9][0-9]* fail=0 unsupported=[0-9]+ total=[0-9]+ files=13' "$log"
          ! grep -q 'SPEC_RUNTIME_UNSUPPORTED_DETAIL' "$log"


