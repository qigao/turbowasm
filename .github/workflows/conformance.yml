name: TurboWasm Spec Conformance

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "CMake*Presets.json"
      - "presets/**"
      - "vcpkg.json"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "tests/conformance/**"
      - ".github/workflows/conformance.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Conformance target
        required: true
        default: core
        type: choice
        options:
          - core
          - core3
          - core3-mir
          - exception-handling
          - threads
          - tail-call
          - multi-memory
          - custom-page-sizes
          - extended-const
          - relaxed-simd
          - memory64
          - component-model

permissions:
  contents: read
  packages: read

env:
  WASM_SPEC_COMMIT: 608711107b7f1edb13efd57b7d79b49477462d36
  WASM_CORE3_COMMIT: 9d36019973201a19f9c9ebb0f10828b2fe2374aa
  WASM_TOOLS_VERSION: 1.261.0
  WASM_TOOLS_LINUX_SHA256: ad62b2176037e93e1348cb65d6212d128ca9f097b63d155569f25215818ff7b1
  COMPONENT_MODEL_COMMIT: a25fc0b372dd21f07f0242c46e98bd0f1ea0c0e1

jobs:
  component-model-provenance:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'component-model' }}
    name: Pinned Component Model fixture provenance
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout TurboWasm
        uses: actions/checkout@v4

      - name: Materialize pinned Component Model
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/component-model"
          rm -rf "$root"
          git init "$root"
          git -C "$root" remote add origin https://github.com/WebAssembly/component-model.git
          git -C "$root" fetch --depth=1 origin "$COMPONENT_MODEL_COMMIT"
          git -C "$root" checkout --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "$COMPONENT_MODEL_COMMIT"
          echo "COMPONENT_MODEL_ROOT=$root" >> "$GITHUB_ENV"

      - name: Verify pinned Component Model fixture sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/conformance/verify_component_model.py
          python3 tests/conformance/verify_component_model.py \
            --manifest tests/conformance/component-model.json \
            --root "$COMPONENT_MODEL_ROOT"

  conformance:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'component-model'
    name: Conformance / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.target != 'core' && format('["{0}"]', inputs.target) || '["core3", "core3-mir", "core", "mir", "exception-handling", "threads", "tail-call", "custom-page-sizes", "memory64", "extended-const", "multi-memory", "relaxed-simd"]') }}
    env:
      TURBOWASM_SDK_RID: linux-x64
      TURBOWASM_TRIPLET: x64-linux
      TURBOWASM_HOST_TRIPLET: x64-linux
      GITHUB_TOKEN: ${{ github.token }}
      CONFORMANCE_PRESET: ${{ matrix.suite == 'core3-mir' && 'ci-core3-mir-user' || matrix.suite == 'core3' && 'ci-core3-user' || matrix.suite == 'mir' && 'ci-conformance-mir-user' || 'ci-conformance-user' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: WebAssembly/spec
          ref: ${{ startsWith(matrix.suite, 'core3') && env.WASM_CORE3_COMMIT || env.WASM_SPEC_COMMIT }}
          path: build/wasm-spec
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: qigao/vcpkg-cache
          path: build/vcpkg-cache-contract
          persist-credentials: false
      - name: Bootstrap the canonical vcpkg tool
        shell: bash
        run: bash cmake/ci/prepare-vcpkg-tool.sh build/vcpkg-cache-contract
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore latest Salts SDK
        shell: pwsh
        run: ./cmake/ci/restore-salts-sdk.ps1 -SaltsRid linux-x64
      - name: Prepare host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config mono-runtime
      - name: Restore pinned Core 3.0 text tools
        if: startsWith(matrix.suite, 'core3')
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/wasm-tools.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" \
            --output "$archive"
          echo "$WASM_TOOLS_LINUX_SHA256  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/core3-tools"
          tar -xzf "$archive" -C "$RUNNER_TEMP/core3-tools"
          echo "TURBOWASM_CORE3_TOOLS=$RUNNER_TEMP/core3-tools/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux/wasm-tools" >> "$GITHUB_ENV"
      - name: Build conformance graph
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset "$CONFORMANCE_PRESET"
          cmake --build --preset "$CONFORMANCE_PRESET" --parallel 2
      - name: Run formal conformance tests
        shell: bash
        env:
          CONFORMANCE_SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          ctest --preset "$CONFORMANCE_PRESET" -R '^turbowasm_conformance_driver$'
          if [[ "$CONFORMANCE_SUITE" != core3* ]]; then
            ctest --preset "$CONFORMANCE_PRESET" -R '^turbowasm_conformance_harness$'
          fi
          ctest --preset "$CONFORMANCE_PRESET" --verbose -R "^turbowasm_conformance_${CONFORMANCE_SUITE}$"
