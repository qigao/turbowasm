name: TurboWasm native build

on:
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
      runner:
        type: string
        required: true
      triplet:
        type: string
        required: true
      preset:
        type: string
        required: true
      tests:
        type: boolean
        required: true
      mir:
        type: boolean
        required: true
      littlefs:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build and qualify
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3
      CI_PRESET: ${{ inputs.preset }}
      CI_PROFILE: ${{ inputs.profile }}
      CI_TRIPLET: ${{ inputs.triplet }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-sdk
        with:
          profile: ${{ inputs.profile }}
          triplet: ${{ inputs.triplet }}
      - name: Install Linux system development dependencies
        if: startsWith(inputs.profile, 'linux-')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libpipewire-0.3-dev libx11-dev libxext-dev
      - name: Select Android NDK
        if: startsWith(inputs.profile, 'android-')
        run: |
          set -euo pipefail
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: inputs.littlefs
        with:
          repository: littlefs-project/littlefs
          ref: v2.11.2
          path: build/littlefs
          persist-credentials: false
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: build/ccache
          key: ccache-${{ inputs.profile }}-${{ github.sha }}
          restore-keys: ccache-${{ inputs.profile }}-
        if: runner.os != 'Windows' && inputs.tests
      - name: Configure ccache
        if: runner.os != 'Windows' && inputs.tests
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y ccache; else brew install ccache; fi
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/build/ccache" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
      - name: Configure complete graph
        run: |
          set -euo pipefail
          cmake --fresh --preset "$CI_PRESET" \
            "-DBUILD_TESTS=${{ inputs.tests && 'ON' || 'OFF' }}" \
            "-DTURBOWASM_ENABLE_MIR_JIT=${{ inputs.mir && 'ON' || 'OFF' }}" \
            "-DTURBOWASM_ENABLE_WASI02_SOCKET_BACKEND=ON" \
            "-DTURBOWASM_ENABLE_WASI_LITTLEFS_ADAPTER=${{ inputs.littlefs && 'ON' || 'OFF' }}" \
            "-DTURBOWASM_LITTLEFS_SOURCE_DIR=$GITHUB_WORKSPACE/build/littlefs" \
            "-DCMAKE_PREFIX_PATH=$VCPKG_INSTALLED_DIR/$CI_TRIPLET"
      - name: Build complete graph
        run: cmake --build --preset "$CI_PRESET"
      - name: Run formal native CTests
        if: inputs.tests
        run: ctest --test-dir "build/$CI_PRESET" --output-on-failure --no-tests=error --output-junit ctest.xml
      - name: Install SDK
        run: cmake --install "build/$CI_PRESET" --prefix "stage/$CI_PROFILE"
      - uses: actions/upload-artifact@v4
        with:
          name: turbowasm-sdk-${{ inputs.profile }}-${{ github.sha }}
          path: stage/${{ inputs.profile }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turbowasm-diagnostics-${{ inputs.profile }}-${{ github.sha }}
          path: |
            build/${{ inputs.preset }}/CMakeCache.txt
            build/${{ inputs.preset }}/CMakeFiles/CMakeConfigureLog.yaml
            build/${{ inputs.preset }}/Testing/Temporary
            build/${{ inputs.preset }}/ctest.xml
          if-no-files-found: warn
