name: TurboWasm native build
on:
  workflow_call:
    inputs:
      builds:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.builds) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-sdk
        with:
          profile: ${{ matrix.sdk }}
          triplet: ${{ matrix.triplet }}
          arch: ${{ matrix.arch }}
      - name: Checkout pinned LittleFS
        if: matrix.littlefs
        uses: actions/checkout@v4
        with:
          repository: littlefs-project/littlefs
          ref: 6cb4e86540eca0d9ba62500a298385c9d863c8be
          path: build/littlefs
          persist-credentials: false
      - name: Configure and build complete graph
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
          BUILD_TESTS: ${{ matrix.tests && 'ON' || 'OFF' }}
          LITTLEFS: ${{ matrix.littlefs && 'ON' || 'OFF' }}
        run: |
          set -euo pipefail
          args=("-DBUILD_TESTS=$BUILD_TESTS")
          if [[ "$LITTLEFS" == ON ]]; then
            args+=("-DTURBOWASM_LITTLEFS_SOURCE_DIR=$GITHUB_WORKSPACE/build/littlefs")
          fi
          cmake --preset "$PRESET" "${args[@]}"
          cmake --build --preset "$PRESET" --parallel 2
      - name: Run full native CTest suite
        if: matrix.tests
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
        run: ctest --preset "$PRESET" --output-on-failure --no-tests=error
      - name: Install target SDK
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
        run: cmake --build --preset "install-$PRESET"
      - name: Upload build result
        uses: actions/upload-artifact@v4
        with:
          name: turbowasm-${{ matrix.id }}
          path: build/ci-install
          if-no-files-found: error
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.id }}
          path: |
            build/${{ matrix.preset }}/CMakeCache.txt
            build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
            build/${{ matrix.preset }}/Testing/Temporary/
          if-no-files-found: ignore
