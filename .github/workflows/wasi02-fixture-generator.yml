name: WASI02 fixture generator

on:
  pull_request:
    paths:
      - "tests/wasi02/fixtures/src/**"
      - "tests/wasi02/fixtures/generated/**"
      - ".github/workflows/wasi02-fixture-generator.yml"
  push:
    branches:
      - master
    paths:
      - "tests/wasi02/fixtures/src/**"
      - "tests/wasi02/fixtures/generated/**"
      - ".github/workflows/wasi02-fixture-generator.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  WASM_TOOLS_VERSION: "1.260.0"
  WASM_TOOLS_SHA256: "2112785b5cf397dc348002988ce65c4db48fea728543eb18e4df21f674c7fcdc"
  WASI_CLOCKS_COMMIT: "71e486b1b44a49687dbe17d5b979d6da6112c7f2"
  WASI_RANDOM_COMMIT: "bd54965b22082b3e157b2fb4bc77987c33ae7d5f"
  WASI_CLI_COMMIT: "e922fd7bd137cd284a5e6c4815a5a630d32fdd01"
  WASI_FILESYSTEM_COMMIT: "971b11617b50e7496bea85f36e60141bda172964"
  WASI_IO_COMMIT: "3983fe1feab6b3a3b4e5c47c8b13daaf22266f00"
  WASI_SOCKETS_COMMIT: "85f0c064f5b9ea2faa3c65b1a80b870119c0fc7f"

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout TurboWasm
        uses: actions/checkout@v4

      - name: Download pinned wasm-tools
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/wasm-tools.tar.gz"
          url="https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz"
          curl --fail --location --retry 3 --output "$archive" "$url"
          echo "${WASM_TOOLS_SHA256}  $archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/wasm-tools"
          tar -xzf "$archive" -C "$RUNNER_TEMP/wasm-tools"
          tool="$(find "$RUNNER_TEMP/wasm-tools" -type f -name wasm-tools -perm -u+x | head -n1)"
          test -n "$tool"
          "$tool" --version
          echo "WASM_TOOLS=$tool" >> "$GITHUB_ENV"

      - name: Generate Component binaries
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/wasi02-fixtures"
          mkdir -p "$out"
          for source in tests/wasi02/fixtures/src/*.wat; do
            name="$(basename "$source" .wat)"
            "$WASM_TOOLS" parse "$source" -o "$out/$name.wasm"
            "$WASM_TOOLS" validate "$out/$name.wasm"
            "$WASM_TOOLS" print "$out/$name.wasm" > "$out/$name.canonical.wat"
            test "$(od -An -tx1 -N8 "$out/$name.wasm" | tr -d ' \n')" = "0061736d0d000100"
          done
          (
            cd "$out"
            sha256sum *.wasm > SHA256SUMS
          )

          python3 - "$out" <<'PY'
          from pathlib import Path
          import hashlib
          import sys

          root = Path(sys.argv[1])
          expected = [
              "cli-exit.wasm",
              "filesystem-preopens.wasm",
              "monotonic-clock.wasm",
              "random-u64.wasm",
              "socket-instance-network.wasm",
              "stream-poll-block.wasm",
          ]
          for name in expected:
              if not (root / name).is_file():
                  raise SystemExit(f"missing generated fixture: {name}")

          lines = [
              "#ifndef TURBOWASM_WASI02_TOOLCHAIN_FIXTURES_H",
              "#define TURBOWASM_WASI02_TOOLCHAIN_FIXTURES_H",
              "",
              "#include <stddef.h>",
              "#include <stdint.h>",
              "",
              "/* Generated by the pinned WASI02 fixture workflow. */",
              "",
          ]
          for filename in expected:
              data = (root / filename).read_bytes()
              symbol = (
                  "turbowasm_wasi02_fixture_"
                  + filename.removesuffix(".wasm").replace("-", "_")
              )
              lines.append(f"static const uint8_t {symbol}[] = {{")
              for i in range(0, len(data), 12):
                  chunk = data[i:i + 12]
                  lines.append(
                      "    "
                      + ",".join(f"0x{byte:02x}" for byte in chunk)
                      + ","
                  )
              lines.append("};")
              lines.append(
                  f"static const size_t {symbol}_size = sizeof({symbol});"
              )
              digest = hashlib.sha256(data).hexdigest()
              lines.append(
                  f'static const char {symbol}_sha256[] = "{digest}";'
              )
              lines.append("")
          lines.append(
              "#endif /* TURBOWASM_WASI02_TOOLCHAIN_FIXTURES_H */"
          )
          (root / "wasi02_toolchain_fixtures.h").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

          cat > "$out/PROVENANCE.txt" <<EOF
          generator=wasm-tools
          version=${WASM_TOOLS_VERSION}
          asset_sha256=${WASM_TOOLS_SHA256}
          source_commit=${GITHUB_SHA}
          wasi_clocks_commit=${WASI_CLOCKS_COMMIT}
          wasi_random_commit=${WASI_RANDOM_COMMIT}
          wasi_cli_commit=${WASI_CLI_COMMIT}
          wasi_filesystem_commit=${WASI_FILESYSTEM_COMMIT}
          wasi_io_commit=${WASI_IO_COMMIT}
          wasi_sockets_commit=${WASI_SOCKETS_COMMIT}
          EOF

      - name: Upload generated fixture corpus
        uses: actions/upload-artifact@v4
        with:
          name: wasi02-toolchain-fixtures
          path: ${{ runner.temp }}/wasi02-fixtures
          if-no-files-found: error
          retention-days: 7

      - name: Verify vendored fixture header
        shell: bash
        run: |
          set -euo pipefail
          committed="tests/wasi02/fixtures/generated/wasi02_toolchain_fixtures.h"
          generated="$RUNNER_TEMP/wasi02-fixtures/wasi02_toolchain_fixtures.h"
          test -f "$committed"
          test -f "$generated"
          cmp "$generated" "$committed"
